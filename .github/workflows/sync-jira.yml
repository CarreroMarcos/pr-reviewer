name: Sync tasks to Jira

on:
  pull_request:
    paths:
      - specs/001-pr-reviewer/tasks.md
      - specs/004-multi-agent-review/tasks.md
      - tools/sync_tasks_to_jira.py
      - .github/workflows/sync-jira.yml
  workflow_dispatch:
    inputs:
      spec:
        description: Which spec's tasks.md to sync
        type: choice
        options:
          - "001"
          - "004"
        default: "004"
      dry_run:
        description: Print creates/updates only; do not write Jira
        type: boolean
        default: true
      scope:
        description: >-
          mvp = setup/foundational + US1; us2..us5 = only that user story's
          [USn] tasks; all = every task (never as default)
        type: choice
        options:
          - mvp
          - us2
          - us3
          - us4
          - us5
          - all
        default: mvp

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Project tasks.md into Jira
        env:
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
          SCOPE: ${{ inputs.scope || 'mvp' }}
          # PR runs have no inputs -> 001 (informational, always dry-run);
          # dispatches default to the active spec via the input default (004).
          SPEC: ${{ inputs.spec || '001' }}
        run: python tools/sync_tasks_to_jira.py
