name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.12"
          enable-cache: true
      - name: Sync
        run: uv sync --frozen --group dev
      - name: Ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Pytest
        run: |
          if [ -d tests ]; then
            c=0
            uv run --frozen pytest -q --tb=short || c=$?
            if [ "$c" -eq 5 ]; then
              echo "pytest: no tests collected - gate tightens when the first test lands"
            else
              exit "$c"
            fi
          else
            echo "tests/ not present yet"
          fi

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: fmt and validate
        run: |
          if ls terraform/*.tf >/dev/null 2>&1; then
            terraform -chdir=terraform init -backend=false -input=false
            terraform -chdir=terraform fmt -check
            terraform -chdir=terraform validate
          else
            echo "no .tf files yet"
          fi
