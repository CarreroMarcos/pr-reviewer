# ============================================================
# Pre-commit hooks (best-practice set for this project).
# Install:  uv sync && uv run pre-commit install
#           uv run pre-commit install --hook-type pre-push
# Run all:  uv run pre-commit run --all-files
#
# Stages: commit = fast hygiene/lint; PUSH = full local CI gate
# (tests + strict lint + terraform) per AGENTS.md/constitution
# "green test run before apply" discipline.
#
# Focus areas mapped to docs/HLD.md:
#   - gitleaks + detect-private-key  -> §1.4 "secrets never touch
#     Terraform state or logs"; blocks .env/keys from being committed
#   - ruff (+ bandit rules)          -> §5 security model, stdlib-only code
#   - terraform_fmt / _validate      -> §7.1 Terraform BOM correctness
# ============================================================
repos:
  # --- Generic repo hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # --- Secret scanning (critical for this project's security model) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Python: lint + format (lambda/ handlers) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Terraform: format at commit; full module validate at pre-push + CI ---
  # tasks.md (T020-T024) splits the BOM across tickets whose files reference
  # each other (compute -> iam roles -> queue/table), so per-commit validate
  # cannot pass until the last BOM file lands. T024's verify runs
  # `terraform validate` explicitly; the pre-push terraform-push hook and CI
  # keep full validate enforcement on every push.
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt

  # --- Pre-push gate: full local CI equivalent ---
  # Runs on every `git push`. pytest tolerates exit 5 (no tests yet) and
  # tightens automatically once the first test lands; the terraform hook
  # activates itself as soon as terraform/ exists (AGENTS.md: init only
  # after that point, never `terraform apply` from an agent session).
  - repo: local
    hooks:
      - id: pytest-push
        name: pytest (full suite; tolerates 5=no tests yet)
        entry: 'bash -c ''uv run --frozen pytest -q --tb=short; c=$?; if [ "$c" -eq 5 ]; then echo "pytest: no tests collected - gate tightens when the first test lands"; exit 0; fi; exit "$c"'''
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-check-push
        name: ruff check (full repo, no autofix)
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-push
        name: ruff format --check (full repo)
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: terraform-push
        name: terraform fmt+validate (self-activates with terraform/)
        entry: 'bash -c ''if [ ! -d terraform ]; then echo "terraform/ absent - skipped"; exit 0; fi; terraform -chdir=terraform init -backend=false -input=false && terraform -chdir=terraform fmt -check && terraform -chdir=terraform validate'''
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
