# ============================================================
# Pre-commit hooks (best-practice set for this project).
# Install:  uv sync && uv run pre-commit install
# Run all:  uv run pre-commit run --all-files
#
# Focus areas mapped to docs/HLD.md:
#   - gitleaks + detect-private-key  -> §1.4 "secrets never touch
#     Terraform state or logs"; blocks .env/keys from being committed
#   - ruff (+ bandit rules)          -> §5 security model, stdlib-only code
#   - terraform_fmt / _validate      -> §7.1 Terraform BOM correctness
# ============================================================
repos:
  # --- Generic repo hygiene ---
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^docs/
      - id: end-of-file-fixer
        exclude: ^docs/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  # --- Secret scanning (critical for this project's security model) ---
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # --- Python: lint + format (lambda/ handlers) ---
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Terraform: format + validate (only run when .tf files exist) ---
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Lambda source zips are generated by Terraform's archive_file,
        # so terraform init here is safe without a real backend.
        args: [--hook-config=--retry-once-with-cleanup=true]
